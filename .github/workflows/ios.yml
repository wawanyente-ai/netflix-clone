name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'netflix-clone/**'
      - 'netflix-clone.xcodeproj/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'netflix-clone/**'
      - 'netflix-clone.xcodeproj/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + unit tests (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use CI Firebase plist
        # GoogleService-Info.plist is gitignored (real secret). CI uses the
        # committed stub so FirebaseApp.configure() has something to read.
        run: cp netflix-clone/GoogleService-Info.ci.plist netflix-clone/GoogleService-Info.plist

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build
        run: |
          xcodebuild \
            -project netflix-clone.xcodeproj \
            -scheme netflix-clone \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            build

      - name: Unit tests
        run: |
          xcodebuild \
            -project netflix-clone.xcodeproj \
            -scheme netflix-clone \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath DerivedData \
            -only-testing:netflix-cloneTests \
            test

      - name: Archive build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: DerivedData/**/*.xcresult