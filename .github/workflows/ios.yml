name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'netflix-clone/**'
      - 'netflix-clone.xcodeproj/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'netflix-clone/**'
      - 'netflix-clone.xcodeproj/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS SDK, no signing)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use CI Firebase plist
        # GoogleService-Info.plist is gitignored (real secret). CI uses the
        # committed stub so FirebaseApp.configure() has something to read.
        run: cp netflix-clone/GoogleService-Info.ci.plist netflix-clone/GoogleService-Info.plist

      - name: Build
        # generic/platform=iOS works with just the SDK — no simulator runtime
        # required, so it's robust across runner images.
        run: |
          xcodebuild \
            -project netflix-clone.xcodeproj \
            -scheme netflix-clone \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            DerivedData/**/*.xcresult
            DerivedData/Logs/Build/*.xcactivitylog